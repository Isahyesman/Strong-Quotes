<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verse — A Daily Quote Companion</title>
<meta name="description" content="Verse: a premium quote companion. Six moods, one quiet ritual — motivation, mindfulness, resilience, faith, discipline, and code.">
<meta name="theme-color" content="#12141C">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verse">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body data-category="all" data-theme="dark">

<div class="grain" aria-hidden="true"></div>

<!-- ===== Top Bar ===== -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">✳</span>
    <span class="brand-name">Verse</span>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="favoritesBtn" aria-label="Open favorites" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2.1-.3 4 .8 6.4 3.2C14.4 4.8 16.3 3.7 18.4 4 22 4.5 23.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg>
      <span class="badge" id="favCount" hidden>0</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Cycle light, dark, and OLED mode">
      <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="theme-icon-oled" viewBox="0 0 24 24" fill="currentColor" hidden><circle cx="12" cy="12" r="9"/></svg>
    </button>
  </div>
</header>

<!-- ===== Category Pills ===== -->
<nav class="pillbar" aria-label="Quote categories">
  <div class="pillbar-track" id="pillTrack" role="tablist"></div>
</nav>

<!-- ===== Main Stage ===== -->
<main class="stage">
  <div class="quote-shell">
    <div class="quote-card" id="quoteCard">
      <span class="quote-glyph" aria-hidden="true">“</span>
      <p class="quote-text" id="quoteText">Loading a little wisdom…</p>
      <div class="quote-meta">
        <span class="quote-author" id="quoteAuthor"></span>
        <span class="quote-cat" id="quoteCatLabel"></span>
      </div>
    </div>
  </div>
</main>

<!-- ===== Action Bar ===== -->
<footer class="action-bar">
  <button class="action-btn" id="favBtn" aria-pressed="false" aria-label="Save to favorites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2.1-.3 4 .8 6.4 3.2C14.4 4.8 16.3 3.7 18.4 4 22 4.5 23.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg>
    <span>Save</span>
  </button>

  <button class="action-btn" id="copyBtn" aria-label="Copy quote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V4a2 2 0 0 1 2-2h10"/></svg>
    <span>Copy</span>
  </button>

  <button class="action-btn action-btn--primary" id="nextBtn">
    <span class="ripple-host">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M13 5l7 7-7 7"/></svg>
      <span>Next Verse</span>
    </span>
  </button>

  <button class="action-btn" id="shareBtn" aria-label="Share quote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
    <span>Share</span>
  </button>
</footer>

<!-- ===== Favorites Drawer ===== -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="favDrawer" role="dialog" aria-modal="true" aria-label="Favorite quotes">
  <div class="drawer-head">
    <h2>Kept Verses</h2>
    <button class="icon-btn" id="closeDrawerBtn" aria-label="Close favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="favList">
    <p class="drawer-empty" id="favEmpty">Nothing saved yet. Tap the heart on a quote you want to keep coming back to.</p>
  </div>
</aside>

<!-- ===== Toast ===== -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
